version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # logback-classic and logback-core must move in lockstep — a version mismatch throws
      # NoClassDefFoundError. Group them so Dependabot bumps both in ONE PR instead of two
      # separate (and individually-broken) ones.
      logback:
        patterns:
          - "ch.qos.logback:*"
    ignore:
      # logback 1.6.x requires SLF4J 2.1 / Spring Boot 4; this project is on Spring Boot 3.4
      # with logback pinned on the 1.5.x line (see pom.xml). Cap at <1.6.0 so Dependabot stops
      # proposing the incompatible major but still offers 1.5.x patch updates.
      - dependency-name: "ch.qos.logback:*"
        versions: [">=1.6.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
