name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Dummy OAuth2 credentials so the Spring context can load without real Google secrets.
      # application.properties falls back to these via ${GOOGLE_CLIENT_ID:YOUR_CLIENT_ID} style
      # placeholders already, but we set explicit values defensively for clarity and stability.
      GOOGLE_CLIENT_ID: test-client-id
      GOOGLE_CLIENT_SECRET: test-client-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # JavaMail's MimeMessage.saveChanges() builds a Message-ID via
      # InetAddress.getLocalHost().getHostName(). GitHub runners don't map their hostname in
      # /etc/hosts, so that reverse-DNS lookup blocks in a native syscall — hanging the send/draft
      # tests indefinitely (uninterruptible, so step/surefire timeouts can't kill it; only the
      # job-level SIGKILL does). Map the hostname so the lookup returns instantly.
      - name: Make hostname resolvable (avoid InetAddress.getLocalHost() hang)
        run: echo "127.0.1.1 $(hostname)" | sudo tee -a /etc/hosts

      - name: Build and test (verify)
        run: ./mvnw -B -ntp verify
        timeout-minutes: 30

      - name: Publish JUnit test summary
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'target/surefire-reports/*.xml'

      - name: Upload surefire reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports/**
          if-no-files-found: warn

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/**
          if-no-files-found: warn
