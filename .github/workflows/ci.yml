name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Dummy OAuth2 credentials so the Spring context can load without real Google secrets.
      # application.properties falls back to these via ${GOOGLE_CLIENT_ID:YOUR_CLIENT_ID} style
      # placeholders already, but we set explicit values defensively for clarity and stability.
      GOOGLE_CLIENT_ID: test-client-id
      GOOGLE_CLIENT_SECRET: test-client-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test (verify)
        # -Dsurefire.timeout=900: Maven self-terminates the forked test JVM at 15 min and writes a
        # thread dump (target/surefire-reports/*.dumpstream) naming the stuck test — reliable where
        # GitHub's step timeout-minutes doesn't kill a blocked process. Produces a NORMAL build
        # failure (retrievable log + always() artifacts). Diagnostic value; tune/remove once green.
        run: ./mvnw -B -ntp verify -Dsurefire.timeout=900
        # Step-level cap set WELL below the job cap (45) so it always fires first — a step
        # timeout fails just this step, letting the always() upload steps run and capture the
        # surefire reports (a job-level timeout is a hard kill that skips them). 20 min is enough
        # to see how far the suite got: broad progress = slow, stalled early = a hung test.
        timeout-minutes: 20

      - name: Publish JUnit test summary
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'target/surefire-reports/*.xml'

      - name: Upload surefire reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports/**
          if-no-files-found: warn

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/**
          if-no-files-found: warn
